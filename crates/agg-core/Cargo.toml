[package]
name = "agg-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "APP-AGG-001 phase 1 shared contract for a managed CLIProxyAPI sidecar"

[[bin]]
name = "agg-poc"
path = "src/bin/agg-poc.rs"

[[bin]]
name = "agg-mock-core"
path = "src/bin/agg-mock-core.rs"

[dependencies]
fs2 = "=0.4.3"
getrandom = "=0.2.15"
# Resolver pin so toml_edit does not pull an indexmap that needs Rust 1.85.
# This crate does not call indexmap directly.
indexmap = "=2.11.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
toml_edit = "=0.22.22"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
